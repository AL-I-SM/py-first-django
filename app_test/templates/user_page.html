<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <title>Ответы и Рейтинг</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        h1,
        h2 {
            text-align: center;
            color: #2c3e50;
        }

        /* Стиль карточки для вопроса */
        .question {
            background-color: #ffffff;
            max-width: 700px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: box-shadow 0.3s ease;
        }

        .question:hover {
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        #testQuestion {
            font-size: 1.2em;
            margin-bottom: 15px;
            font-weight: 600;
            color: #34495e;
        }

        /* Кнопка */
        button {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #3498db;
        }

        /* Раздел ожидания */
        .sendAnswer {
            max-width: 700px;
            margin: 20px auto;
            text-align: center;
            background-color: #ecf0f1;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        }

        #waitInfo {
            font-size: 1.2em;
            margin-bottom: 15px;
            color: #7f8c8d;
        }

        /* Таблица рейтинга */
        #ratingTable {
            width: 80%;
            max-width: 900px;
            margin: 40px auto;
            border-collapse: collapse;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            background-color: #fff;
        }

        #ratingTable th,
        #ratingTable td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        #ratingTable th {
            background-color: #34495e;
            color: #fff;
            font-weight: 600;
        }

        /* Анимация при наведении на строки таблицы */
        #ratingTable tbody tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>

<body>

    <h1>Ответьте на вопрос</h1>

    <div class="question">
        <p id="testQuestion" hidden>Вопрос</p>
        <div id="questionId" hidden></div>
        <div id="answerOptions" hidden></div>
        <input type="text" id="answerInput" hidden placeholder="Ваш ответ" />
    </div>

    <div class="sendAnswer">
        <button id="submitButton" hidden onclick="sendAnswer()">Отправить ответ</button>
        <p id="waitInfo">- Ожидание начала теста -</p>
    </div>

    <div class="sendAnswer">
        <button onclick="manualStartTest()">Начать вручную</button>
    </div>

    <h2>Общий рейтинг</h2>
    <table id="ratingTable">
        <thead>
            <tr>
                <th>Пользователь</th>
                <th>Очки</th>
                <th>Время (сек)</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

</body>

</html>

<script>
    const socket = new WebSocket('ws://' + window.location.host + '/ws/rating/');

    socket.onopen = () => {
        console.log('WebSocket подключен');
        getUserTable();
        getQuestion('');
    };

    // Обработчик ошибок
    socket.onerror = (error) => {
        console.error('WebSocket ошибка:', error);
    };

    socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'rating_updates') {
            // Обновляем таблицу
            console.log('обновление рейтинга');
            updateRatingTable(data.content);
        }

        if (data.type === 'rating_table') {
            // Обновляем таблицу
            console.log('получена таблица рейтнига');
            updateRatingTable(data.content);
        }

        if (data.type === 'question') {
            // Обновляем вопрос
            console.log(data.user)

            if (data.user === "{{ user|escapejs }}") {
                console.log('получен вопрос');
                updateDataQuestion(data.content);
            }
        }

        if (data.type === 'start') {
            console.log('начало теста');
            getQuestion('next')
        }

        if (data.type === 'end_test') {
            // Закончить тест
            if (data.user === "{{ user|escapejs }}") {
                endTest(data.content);
            }
        }
    };

    function updateRatingTable(ratingData) {
        const tbody = document.getElementById('ratingTable').getElementsByTagName('tbody')[0];
        tbody.innerHTML = '';
        for (const key in ratingData) {
            const row = tbody.insertRow();
            const userName = key;             // 'computer', 'computer1'
            const userData = ratingData[key]; // объект с score и time

            row.insertCell().textContent = userName;
            row.insertCell().textContent = userData.score;
            row.insertCell().textContent = userData.time;

        }
    }

    function appendUser() {
        const waitInfo = document.getElementById('waitInfo');
        waitInfo.textContent = "тест закончен";
        socket.send(JSON.stringify({
            type: "auth",
            user: "{{ user|escapejs }}"
        }));
    }

    function getUserTable() {
        socket.send(JSON.stringify({
            type: "table",
            user: "{{ user|escapejs }}"
        }));
    }

    function manualStartTest() {
        socket.send(JSON.stringify({
            type: "start",
            user: "{{ user|escapejs }}"
        }));
    }

    function sendAnswer() {

        const radios = document.querySelectorAll('input[name="answer"]');
        const answered_at = new Date();

        let answer = '';

        console.log('время: ', answered_at);

        if (radios.length > 0) {
            // Есть радиокнопки
            radios.forEach(r => {
                if (r.checked) answer = r.value;
            });
        }
        else {
            // Поле для ввода
            answer = document.getElementById('answerInput').value;
        }

        if (!answer) {
            alert('Пожалуйста, введите ответ');
            return;
        }

        questionId = document.getElementById('questionId').textContent;

        socket.send(JSON.stringify({
            type: "answer",
            user: "{{ user|escapejs }}",
            answer: answer,
            question_id: questionId,
            answered_at: answered_at
        }));
        console.log('ответ отправлен: ', answer, 'id :', questionId);
        getQuestion('next');
    }

    function getQuestion(state) {
        console.log('запрос: вопрос');
        socket.send(JSON.stringify({
            type: "question",
            user: "{{ user|escapejs }}",
            state: state
        }));
    }

    function updateDataQuestion(questionData) {
        console.log('обновлен вопрос');

        document.getElementById('answerOptions').hidden = false;
        document.getElementById('submitButton').hidden = false;
        document.getElementById('answerInput').hidden = false;
        document.getElementById('testQuestion').hidden = false;
        document.getElementById('waitInfo').hidden = true;

        options = questionData.options;

        const optionsContainer = document.getElementById('answerOptions');
        const testQuestion = document.getElementById('testQuestion');
        const answerInput = document.getElementById('answerInput');
        const questionId = document.getElementById('questionId');

        optionsContainer.innerHTML = '';

        questionId.textContent = questionData.question_id;
        testQuestion.textContent = questionData.text;

        answerInput.value = "";

        if (options && options.length > 0) {
            // Есть варианты — создаем радиокнопки
            options.forEach((option, index) => {
                const label = document.createElement('label');
                label.id = 'radioBlock';
                label.style.display = 'block';
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'answer';
                radio.value = option;
                if (index === 0) radio.checked = true; // по умолчанию выбран первый

                label.appendChild(radio);
                label.appendChild(document.createTextNode(option));
                optionsContainer.appendChild(label);
            });
            // Показываем блок с радиокнопками
            document.getElementById('radioBlock').hidden = false;
            // скрываем поле для ввода
            document.getElementById('answerInput').hidden = true;
        } else {
            // Нет вариантов — показываем поле для ввода
            document.getElementById('answerInput').hidden = false;
            document.getElementById('answerInput').value = '';
        }
    }

    function endTest(questionData) {
        console.log('тест закончен');
        const waitInfo = document.getElementById('waitInfo');
        waitInfo.textContent = "тест закончен";

        document.getElementById('answerOptions').hidden = true;
        document.getElementById('submitButton').hidden = true;
        document.getElementById('answerInput').hidden = true;
        document.getElementById('testQuestion').hidden = true;
        document.getElementById('waitInfo').hidden = false;

    }

</script>
</body>

</html>
