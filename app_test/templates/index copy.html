<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Рейтинг в реальном времени</title>
<style>
    table {
        width: 50%;
        border-collapse: collapse;
    }
    th, td {
        border: 1px solid #333;
        padding: 8px;
        text-align: left;
    }
    th {
        background-color: #f0f0f0;
    }
</style>
</head>
<body>
<h1>Общий рейтинг</h1>
<table id="ratingTable">
    <thead>
        <tr>
            <th>Пользователь</th>
            <th>Очки</th>
            <th>Время (сек)</th>
        </tr>
    </thead>
    <tbody>
        <!-- Строки рейтинга будут добавляться сюда -->
    </tbody>
</table>

<script>
const socket = new WebSocket('ws://' + window.location.host + '/ws/rating/');

socket.onopen = () => {
    console.log('WebSocket подключен');
};

socket.onerror = (error) => {
    console.error('WebSocket ошибка:', error);
};

socket.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (Array.isArray(data)) {
        updateRatingTable(data);
    }
};

function updateRatingTable(ratingData) {
    const tbody = document.getElementById('ratingTable').getElementsByTagName('tbody')[0];
    tbody.innerHTML = '';
    ratingData.forEach(item => {
        const row = tbody.insertRow();
        row.insertCell().textContent = item.user;
        row.insertCell().textContent = item.score;
        row.insertCell().textContent = item.time;
    });
}
</script>
</body>
</html>
