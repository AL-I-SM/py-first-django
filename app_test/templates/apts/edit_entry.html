{% extends "apts/base.html" %}
{% block content %}
<p><a href="{% url 'apts:topic' topic.id %}">{{ topic }}</a></p>
<p>Edit entry:</p>
<form action = "{% url 'apts:edit_entry' entry.id %}" method = 'post'>
    {% csrf_token %}
    {{ form.as_p }}
    <button name='sumit'>save changes</button>
</form>
{% endblock content %}
