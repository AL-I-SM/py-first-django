{% extends "base.html" %}
{% block content %}
    {% if form.errors %}
    <p>Your username and password didn't match</p>
    {% endif %}

    <form method="post" action="{% url 'users:logout' %}">
        {% csrf_token %}
        {{ form.as_p }}

    <button name="submit">log in</button>
    </form>
{% endblock content%}
