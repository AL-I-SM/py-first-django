{% extends "apts/base.html" %}
{% block content %}
<p>Topics</p>
<ul>
    {% for topic in topics %}
        <li>
            <a href="{% url 'apts:topic' topic.id %}">{{ topic }}</a href="{% url 'apts:topic' topic.id %}">
        </li>
    {% empty %}
    <li>No topics have been added yet</li>
    {% endfor %}
</ul>
    <a href="{% url 'apts:new_topic' %}"> Add new topic:</a>
{% endblock content %}
