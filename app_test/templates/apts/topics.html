{% extends "apts/base.html" %}
{% block header %}
    <h1>Темы блога:</h1>
{% endblock header %}
{% block content %}
    <ul>
    {% for topic in topics %}
        <li>
            <a href="{% url 'apts:topic' topic.id %}">{{ topic }}</a>
        </li>
    {% empty %}
        <li>No topics have been added yet</li>
    {% endfor %}
    <br><a href="{% url 'apts:new_topic' %}"> Add new topic:</a>
    </ul>
{% endblock content%}
