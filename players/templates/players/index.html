<a href="{% url 'players:register' %}">Регистрация нового пользователя</a>
{% block content %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Работа с базой данных</title>
</head>
<body class="container">
    <form method="POST" action="create">
        {% csrf_token %}
        <p>
            <label>Введите имя</label><br>
            <input type="text" name="name" />
        </p>
        <p>
            <label>Введите возраст</label><br>
            <input type="number" name="age" />
        </p>
        <input type="submit" value="Сохранить" />
    </form>
    {% if people.count > 0 %}
    <h2>Список пользователей</h2>
    <table>
        <tr><th>Id</th><th>Имя</th><th>Возраст</th></tr>
        {% for person in people %}
        <tr><td>{{ person.id }}</td>
            <td style="text-align: center;"> {{ person.name }}</td>
            <td>{{ person.age }}</td>
            <td><a href="edit/{{person.id}}">Изменить</a> |
                <a href="delete/{{person.id}}">Удалить</a> </td>
        </tr>
        {% endfor %}
    </table>
    {% endif %}
</body>
</html>

<style>
    label, input {
        display: block;
    }
    span.helptext {
        display: none;
    }
</style>
{% endblock %}
