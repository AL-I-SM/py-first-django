<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <title>Ответы и Рейтинг</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .question {
            margin-bottom: 20px;
        }

        #ratingTable {
            width: 60%;
            border-collapse: collapse;
            margin-top: 30px;
        }

        th,
        td {
            border: 1px solid #333;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f0f0f0;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <h1>Ответьте на вопрос</h1>

    <div class="question">
        <input type="text" id="answerInput" hidden placeholder="Ваш ответ" />
        <button id="submitButton" hidden onclick="appendUser()">Отправить ответ</button>
    </div>

    <div class="start">
        <p id="waitInfo">- Ожидание начала теста -</p>
        <button id="submitButton" onclick="startTest()">Отправить ответ</button>
  
    </div>

    <h2>Общий рейтинг</h2>
    <table id="ratingTable">
        <thead>
            <tr>
                <th>Пользователь</th>
                <th>Очки</th>
                <th>Время (сек)</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        const socket = new WebSocket('ws://' + window.location.host + '/ws/rating/');

        socket.onopen = () => {
            console.log('WebSocket подключен');
            getUserTable();
        };

        // Обработчик ошибок
        socket.onerror = (error) => {
            console.error('WebSocket ошибка:', error);
        };

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'rating_updates') {
                // Обновляем таблицу
                console.log('обновление рейтинга');
                updateRatingTable(data.content);
            }
            if (data.type === 'rating_table') {
                // Обновляем таблицу
                console.log('получена таблица рейтнига');
                updateRatingTable(data.content);
            }
        };

        function updateRatingTable(ratingData) {
            const tbody = document.getElementById('ratingTable').getElementsByTagName('tbody')[0];
            tbody.innerHTML = '';
            for (const key in ratingData) {
                const row = tbody.insertRow();
                const userName = key;             // 'computer', 'computer1'
                const userData = ratingData[key]; // объект с score и time

                row.insertCell().textContent = userName;
                row.insertCell().textContent = userData.score;
                row.insertCell().textContent = userData.time;

            }
        }

        function sendAnswer() {
            const answer = document.getElementById('answerInput').value.trim();
            if (!answer) {
                alert('Пожалуйста, введите ответ');
                return;
            }
            // Отправляем ответ на сервер через WebSocket
            socket.send(JSON.stringify({ answer: answer, user: 'Ваше имя' }));
            document.getElementById('answerInput').value = '';
        }

        function appendUser() {
            socket.send(JSON.stringify({ type: "auth", user: "{{ user|escapejs }}" }));
        }

        function getUserTable() {
            socket.send(JSON.stringify({ type: "table", user: "{{ user|escapejs }}" }));
        }

        function startTest() {
            console.log('начало теста');
            document.getElementById('submitButton').hidden = false;
            document.getElementById('answerInput').hidden = false;
            document.getElementById('waitInfo').hidden = true;
        }
    </script>
</body>

</html>
